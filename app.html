<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- seo -->
    <!-- Sunucu fonksiyonu (api/page.js) bu bölümü her adres için başlık, açıklama ve yapılandırılmış veriyle doldurur -->
    <title>Adam Asmaca · Miraç Deprem</title>
    <meta name="robots" content="noindex" />
    <!-- /seo -->
    <meta name="theme-color" content="#21101f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/src/main.js"></script>
    <script defer src="https://nabiz.miracdeprem.com/js/nabiz.js" data-site="hangman.miracdeprem.com"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 data-i18n="title">Adam Asmaca</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="lang-switch" role="group" data-i18n-aria="language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="page">
      <div class="game">
        <section class="stage" id="stage">
          <svg class="figure" id="figure" viewBox="10 20 460 332" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <g class="scenery">
              <!-- Tepe ve selvi -->
              <path d="M-20 360V312C60 292 130 300 190 310C260 322 340 306 430 318C520 328 560 330 640 360Z" />
              <path d="M34 306C22 262 34 196 46 160C58 196 70 262 58 306Z" />
              <!-- Darağacı: oyma tahta -->
              <path d="M122 322L128 40H300V60H150L146 322Z" />
              <path d="M92 318H180L190 334H82Z" />
              <path d="M148 126L222 58H246L150 152Z" />
              <path d="M266 58H274V96H266Z" />
            </g>
            <g class="cutout">
              <circle cx="137" cy="190" r="3.5" />
              <circle cx="137" cy="212" r="3.5" />
              <circle cx="136" cy="234" r="3.5" />
              <circle cx="136" cy="256" r="3.5" />
              <path d="M180 47L188 50L180 53L172 50Z" />
              <path d="M212 47L220 50L212 53L204 50Z" />
              <path d="M244 47L252 50L244 53L236 50Z" />
            </g>
            <!-- Tasvir: her yanlış harfte sıradaki parça perdeye yaklaşır (sıra: baş, gövde, kollar, bacaklar) -->
            <g transform="translate(270 96)">
              <g class="part">
                <path class="piece piece-mustard" d="M-20 18C-20-2-10-12 0-12C12-12 22-2 21 18C21 34 12 46 0 46C-12 46-20 34-20 18Z" />
                <path class="piece piece-crimson" d="M-22 2C-16-20 16-20 22 2C10-4-10-4-22 2Z" />
                <g class="cutout">
                  <circle cx="-7" cy="17" r="3" />
                  <circle cx="8" cy="17" r="3" />
                  <path d="M-5 32H7V34.5H-5Z" />
                </g>
              </g>
              <g class="part">
                <path class="piece piece-indigo" d="M-24 54C-10 46 10 46 24 54L28 136C10 144-10 144-28 136Z" />
                <g class="cutout">
                  <path d="M0 68L8 80L0 92L-8 80Z" />
                  <circle cx="-13" cy="110" r="3" />
                  <circle cx="0" cy="114" r="3" />
                  <circle cx="13" cy="110" r="3" />
                  <circle cx="-10" cy="126" r="2.4" />
                  <circle cx="10" cy="126" r="2.4" />
                </g>
              </g>
              <g class="part">
                <path class="piece piece-emerald" d="M-16 64C-34 74-48 92-58 112L-46 120C-34 102-20 88-4 80Z" />
                <circle class="rivet" cx="-13" cy="66" r="2.6" />
              </g>
              <g class="part">
                <path class="piece piece-emerald" d="M16 64C34 74 48 92 58 112L46 120C34 102 20 88 4 80Z" />
                <circle class="rivet" cx="13" cy="66" r="2.6" />
              </g>
              <g class="part">
                <path class="piece piece-crimson" d="M-22 134L-6 136L-18 208L-2 218L-6 226L-36 214Z" />
                <circle class="rivet" cx="-14" cy="138" r="2.6" />
              </g>
              <g class="part">
                <path class="piece piece-crimson" d="M22 134L6 136L18 208L2 218L6 226L36 214Z" />
                <circle class="rivet" cx="14" cy="138" r="2.6" />
              </g>
            </g>
          </svg>
          <p class="lives">
            <span id="lives-text"></span>
            <span class="lives-dots" id="lives-dots" aria-hidden="true"></span>
          </p>
          <div class="word" id="word" role="img"></div>
          <p class="status" id="status" role="status"></p>
        </section>

        <section class="panel">
          <div class="side">
            <div class="category">
              <label for="category" data-i18n="category"></label>
              <select id="category"></select>
            </div>
            <dl class="stats">
              <div><dt data-i18n="wins"></dt><dd id="stat-wins">0</dd></div>
              <div><dt data-i18n="losses"></dt><dd id="stat-losses">0</dd></div>
              <div><dt data-i18n="streak"></dt><dd id="stat-streak">0</dd></div>
              <div><dt data-i18n="bestStreak"></dt><dd id="stat-best">0</dd></div>
            </dl>
          </div>
          <div class="controls">
            <div class="keyboard" id="keyboard" role="group" data-i18n-aria="keyboard"></div>
            <div class="actions">
              <button type="button" class="btn btn-primary" id="new-word" data-i18n="newWord"></button>
              <button type="button" class="btn btn-secondary" id="hint" data-i18n="hint"></button>
              <button type="button" class="btn btn-ghost" id="reset-stats" data-i18n="resetStats"></button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <dialog class="fb-dialog" id="fb-dialog" aria-labelledby="fb-title">
      <form class="fb-form" id="fb-form" novalidate>
        <h2 class="fb-title" id="fb-title" data-i18n="feedbackTitle"></h2>
        <p class="fb-intro" data-i18n="feedbackIntro"></p>
        <label class="fb-label" for="fb-name" data-i18n="feedbackName"></label>
        <input class="fb-input" id="fb-name" type="text" maxlength="100" autocomplete="name" />
        <label class="fb-label" for="fb-contact" data-i18n="feedbackContact"></label>
        <input class="fb-input" id="fb-contact" type="text" maxlength="255" autocomplete="email" required />
        <label class="fb-label" for="fb-message" data-i18n="feedbackMessage"></label>
        <textarea class="fb-input" id="fb-message" rows="4" maxlength="2000" required></textarea>
        <div class="fb-hp" aria-hidden="true">
          <label for="fb-website">Website</label>
          <input id="fb-website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="fb-status" id="fb-status" role="status"></p>
        <div class="fb-actions">
          <button type="button" class="btn btn-ghost" id="fb-close" data-i18n="feedbackClose"></button>
          <button type="submit" class="btn btn-primary" id="fb-submit" data-i18n="feedbackSend"></button>
        </div>
      </form>
    </dialog>

    <footer class="footer">
      <button type="button" class="fb-open" id="fb-open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
        <span data-i18n="feedback"></span>
      </button>
      <a class="footer-social" href="https://www.instagram.com/adamasmaca.oyunu/" target="_blank" rel="noopener" aria-label="Instagram: @adamasmaca.oyunu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" /><circle cx="12" cy="12" r="4" /><circle class="ig-dot" cx="17.2" cy="6.8" r="1.1" /></svg>
        <span>@adamasmaca.oyunu</span>
      </a>
      <p class="footer-owner">© <span id="footer-year">2026</span> Miraç Deprem</p>
    </footer>

    <noscript><p class="noscript">Bu oyun JavaScript gerektirir. · This game requires JavaScript.</p></noscript>
  </body>
</html>
