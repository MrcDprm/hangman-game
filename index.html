<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adam Asmaca · Miraç Deprem</title>
    <meta name="description" content="10 kategoride Türkçe ve İngilizce 1.000'er kelimeyle adam asmaca oyunu." />
    <meta name="theme-color" content="#0b0f15" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="src/theme-init.js"></script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://www.miracdeprem.com" aria-label="miracdeprem.com">
        <span class="brand-logo">md</span>
        <span class="brand-path">~/hangman</span>
      </a>
      <div class="topbar-actions">
        <div class="lang-switch" role="group" data-i18n-aria="language">
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-button" id="theme-toggle" data-i18n-aria="toggleTheme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="page">
      <section class="intro">
        <h1 data-i18n="title">Adam Asmaca</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </section>

      <div class="game">
        <section class="stage">
          <svg class="figure" id="figure" viewBox="0 0 200 240" aria-hidden="true">
            <g class="gallows">
              <line x1="20" y1="228" x2="120" y2="228" />
              <line x1="50" y1="228" x2="50" y2="18" />
              <line x1="50" y1="18" x2="140" y2="18" />
              <line x1="50" y1="55" x2="87" y2="18" />
              <line x1="140" y1="18" x2="140" y2="48" />
            </g>
            <circle class="part" cx="140" cy="70" r="22" pathLength="1" />
            <line class="part" x1="140" y1="92" x2="140" y2="152" pathLength="1" />
            <line class="part" x1="140" y1="108" x2="114" y2="134" pathLength="1" />
            <line class="part" x1="140" y1="108" x2="166" y2="134" pathLength="1" />
            <line class="part" x1="140" y1="152" x2="118" y2="194" pathLength="1" />
            <line class="part" x1="140" y1="152" x2="162" y2="194" pathLength="1" />
          </svg>
          <p class="lives">
            <span class="lives-dots" id="lives-dots" aria-hidden="true"></span>
            <span id="lives-text"></span>
          </p>
        </section>

        <section class="panel">
          <div class="category">
            <label for="category" data-i18n="category"></label>
            <select id="category"></select>
          </div>

          <div class="word" id="word" role="img"></div>
          <p class="status" id="status" role="status"></p>

          <div class="keyboard" id="keyboard" role="group" data-i18n-aria="keyboard"></div>

          <div class="actions">
            <button type="button" class="btn btn-primary" id="new-word" data-i18n="newWord"></button>
            <button type="button" class="btn btn-secondary" id="hint" data-i18n="hint"></button>
            <button type="button" class="btn btn-ghost" id="reset-stats" data-i18n="resetStats"></button>
          </div>

          <dl class="stats">
            <div><dt data-i18n="wins"></dt><dd id="stat-wins">0</dd></div>
            <div><dt data-i18n="losses"></dt><dd id="stat-losses">0</dd></div>
            <div><dt data-i18n="streak"></dt><dd id="stat-streak">0</dd></div>
            <div><dt data-i18n="bestStreak"></dt><dd id="stat-best">0</dd></div>
          </dl>
        </section>
      </div>
    </main>

    <dialog class="fb-dialog" id="fb-dialog" aria-labelledby="fb-title">
      <form class="fb-form" id="fb-form" novalidate>
        <h2 class="fb-title" id="fb-title" data-i18n="feedbackTitle"></h2>
        <p class="fb-intro" data-i18n="feedbackIntro"></p>
        <label class="fb-label" for="fb-name" data-i18n="feedbackName"></label>
        <input class="fb-input" id="fb-name" type="text" maxlength="100" autocomplete="name" />
        <label class="fb-label" for="fb-contact" data-i18n="feedbackContact"></label>
        <input class="fb-input" id="fb-contact" type="text" maxlength="255" autocomplete="email" required />
        <label class="fb-label" for="fb-message" data-i18n="feedbackMessage"></label>
        <textarea class="fb-input" id="fb-message" rows="4" maxlength="2000" required></textarea>
        <div class="fb-hp" aria-hidden="true">
          <label for="fb-website">Website</label>
          <input id="fb-website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="fb-status" id="fb-status" role="status"></p>
        <div class="fb-actions">
          <button type="button" class="btn btn-ghost" id="fb-close" data-i18n="feedbackClose"></button>
          <button type="submit" class="btn btn-primary" id="fb-submit" data-i18n="feedbackSend"></button>
        </div>
      </form>
    </dialog>

    <footer class="footer">
      <button type="button" class="fb-open" id="fb-open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
        <span data-i18n="feedback"></span>
      </button>
      <nav class="footer-projects" data-i18n-aria="jsProjects">
        <a href="https://tictactoe.miracdeprem.com">Tic-Tac-Toe</a>
        <a href="https://hangman.miracdeprem.com" aria-current="page">Hangman</a>
        <a href="https://quiz.miracdeprem.com">Quiz App</a>
        <a href="https://weather.miracdeprem.com">Weather App</a>
      </nav>
      <div class="footer-meta">
        <span>© 2026 Miraç Deprem</span>
        <a href="https://www.miracdeprem.com" data-i18n="portfolio"></a>
        <a href="https://github.com/MrcDprm/hangman-game" data-i18n="source"></a>
      </div>
    </footer>

    <noscript><p class="noscript">Bu oyun JavaScript gerektirir. · This game requires JavaScript.</p></noscript>
  </body>
</html>
